name: Deploy Metro-Synapse to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build Next.js 3D Digital Twin & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-next/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend-next
          npm ci

      - name: Build Next.js Static Export
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: /Google_Fund_My_Crazy_
        run: |
          cd frontend-next
          npm run build

      - name: Create .nojekyll in Export Directory
        run: touch frontend-next/out/.nojekyll

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend-next/out
          publish_branch: gh-pages
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"

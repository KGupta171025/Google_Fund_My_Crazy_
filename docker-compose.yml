version: '3.8'

services:
  metro-backend-go:
    build:
      context: ./backend-go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped

  metro-ai-python:
    build:
      context: ./ai-engine-python
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

  metro-frontend-next:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_GO_BACKEND_URL=http://localhost:8080
      - NEXT_PUBLIC_PYTHON_AI_URL=http://localhost:8000
    depends_on:
      - metro-backend-go
      - metro-ai-python
    restart: unless-stopped
